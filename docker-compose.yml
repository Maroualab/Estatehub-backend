services:
  mysql:
    image: mysql:8.0
    container_name: estatehub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estatehub_db
      MYSQL_USER: estatehub
      MYSQL_PASSWORD: estatehub
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: estatehub-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/estatehub_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: estatehub
      SPRING_DATASOURCE_PASSWORD: estatehub
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
