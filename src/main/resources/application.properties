spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/estatehub_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=INFO

# Application Frontend URL
app.frontend.url=http://localhost:4200

# --- JWT Configuration ---
# Secret key (minimum 32 chars for HS256)
app.jwt.secret=dK8xQz3rW7vJ2mNpT5sYfA9gBcEhUiLoRwXyZqDjFlGkMnHtVbCaSeWoQpIrUxY
# Token expiration: 1 800 000 ms = 30 minutes
app.jwt.expiration-ms=1800000

# --- CORS Configuration ---
# Allowed origins for CORS (comma-separated)
app.cors.allowed-origins=http://localhost:4200

# --- DevTools ---
# Disable restart classloader to prevent class casting conflicts during hot reload.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=true